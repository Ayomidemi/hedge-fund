[project]
name = "hedge-fund-backend"
version = "0.1.0"
description = "FastAPI backend for the Pease Capital hedge fund platform."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.28.0",
    "yfinance>=0.2.54",
]

[tool.alembic]
script_location = "alembic"
